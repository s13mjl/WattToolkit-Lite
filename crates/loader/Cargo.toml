[package]
name = "wattoolkit-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The release exe embeds a requireAdministrator manifest (see app.manifest).
# A test harness would inherit it and fail to start without elevation, and this
# binary has no unit tests of its own, so no test target is needed.
[[bin]]
name = "wattoolkit-lite"
path = "src/main.rs"
test = false

[dependencies]
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.34"
wtlite-core = { path = "../core" }
wtlite-ui = { path = "../ui" }

[build-dependencies]
# Embeds the .ico, application manifest and version info into the exe.
embed-resource = "3.0.11"
