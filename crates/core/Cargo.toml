[package]
name = "wtlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
env_logger = "0.11.11"
image = "0.25.10"
libloading = "0.9.0"
log = "0.4.34"
rand = "0.10.2"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
regex = "1.13.1"
rmp-serde = "1.3.1"
rustls = "0.23.44"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal", "fs"] }
tokio-rustls = "0.26.5"
ureq = { version = "3.4.1", features = ["json"] }
webpki-roots = "1.0.9"
winreg = "0.56.0"
x509-parser = "0.18.1"
